{% extends "base.html" %}

{% block title %}Recruitment Analytics — HireMind AI{% endblock %}

{% block content %}
<div className="card" style="margin-bottom: 1.5rem;">
    <h1 style="font-size: 1.2rem; font-weight: 800;">Recruitment Analytics & Automation ROI</h1>
    <p style="font-size: 0.8rem; color: var(--text-muted);">Real-time performance metrics across candidate screening and verification workflows.</p>
</div>

<div className="card">
    <canvas id="applicationsChart" height="100"></canvas>
</div>

<script>
document.addEventListener("DOMContentLoaded", function() {
    const ctx = document.getElementById('applicationsChart').getContext('2d');
    new Chart(ctx, {
        type: 'line',
        data: {
            labels: ['Aug 25', 'Aug 26', 'Aug 27', 'Aug 28', 'Aug 29', 'Aug 30', 'Aug 31', 'Sep 01'],
            datasets: [{
                label: 'Candidates Screened',
                data: [24, 42, 58, 76, 95, 110, 140, 185],
                borderColor: '#0A66C2',
                backgroundColor: 'rgba(10, 102, 194, 0.1)',
                fill: true
            }]
        }
    });
});
</script>
{% endblock %}
