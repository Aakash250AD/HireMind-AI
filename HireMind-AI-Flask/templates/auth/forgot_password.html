{% extends "base.html" %}

{% block title %}Reset Password — HireMind AI{% endblock %}

{% block content %}
<div style="max-w: 420px; margin: 3rem auto;" className="card">
    <div style="text-align: center; margin-bottom: 1.5rem;">
        <h1 style="font-size: 1.4rem; font-weight: 800;">Reset Your Password</h1>
        <p style="font-size: 0.8rem; color: var(--text-muted); margin-top: 0.25rem;">Enter your email address to receive reset instructions.</p>
    </div>

    <form method="POST" action="/login">
        <div style="margin-bottom: 1.5rem;">
            <label style="display: block; font-size: 0.75rem; font-weight: 700; margin-bottom: 0.3rem;">Email Address</label>
            <input type="email" name="email" required placeholder="recruiter@company.com" style="width: 100%; padding: 0.6rem; border: 1px solid var(--border-color); border-radius: 6px; font-size: 0.85rem;">
        </div>

        <button type="submit" className="btn btn-primary" style="width: 100%; padding: 0.65rem;">Send Reset Link</button>
    </form>
</div>
{% endblock %}
